[package]
name = "zawk"
version = "0.6.5"
authors = [
    "Eli Rosenthal <ezr@cs.brown.edu>",
    "linux_china <libing.chen@gmail.com>",
]
edition = "2024"
description = "An efficient Awk-like language implementation by Rust with stdlib"
homepage = "https://github.com/linux-china/zawk"
repository = "https://github.com/linux-china/zawk"
readme = "README.md"
keywords = ["awk", "csv", "tsv", "etl", "stdlib"]
categories = ["command-line-utilities", "text-processing"]
license = "MIT OR Apache-2.0"
build = "build.rs"


[dependencies]
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
petgraph = "0.8"
smallvec = "1.16"
hashbrown = "0.17"
foldhash = "0.2"
growable-bloom-filter = "2.1"
regex = "1.13"
regex-syntax = "0.8"
regex-automata = "0.4"
itoa = "1.0"
ryu = "1.0"
libc = "0.2"
rand = { version = "0.10", features = ["default"] }
lalrpop-util = "0.23.2"
unicode-xid = "0.2.6"
clap = "4.6"
crossbeam-channel = "0.5"
crossbeam = "0.8"
num_cpus = "1.17"
cfg-if = "1.0"
memchr = "2.8"
simdutf8 = "0.1"
grep-cli = "0.1"
termcolor = "1.4"
itertools = "0.15"
num-traits = "0.2"
paste = "1.0"
cranelift = "0.137.0"
cranelift-codegen = "0.137.0"
cranelift-module = "0.137.0"
cranelift-native = "0.137.0"
cranelift-jit = "0.137.0"
fast-float = "0.2"
bumpalo = { version = "3.20", features = ["collections"] }
uuid = { version = "1.29", features = ["v4", "v7", "fast-rng"] }
ulid = "3.0"
tsid = "0.3"
rs-snowflake = "0.6"
fend-core = "1.5"
evalexpr = "13.1"
chrono = "0.4"
chrono-systemd-time = "0.4.0"
dateparser = "0.3"
base58 = "0.2"
base64 = "0.23"
base85 = "2"
data-encoding = "2.11"
urlencoding = "2.1"
flate2 = "1.1"
zstd = "0.14"
lz4_flex = "0.14"
bzip2 = "0.6"
liblzma = { version = "0.4", default-features = false, features = ["static"] }
url = "2.5"
email_address = "0.2"
sha2 = "0.11"
md5 = "0.8"
crc = "3.4"
adler = "1"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", features = ["use_pem", "rust_crypto"] }
bcrypt = "0.19"
cbc = "0.2"
aes-gcm = "0.11"
aes = "0.9"
murmur3 = "0.5"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64"] }
blake3 = "1.8"
hex = "0.4"
miniserde = "0.1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde_json_path = "0.7"
sxd-document = "0.3"
sxd-xpath = "0.4"
tl = { version = "0.7" }
logos = "0.16.1"
local-ip-address = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
async-nats = { version = "0.50", default-features = false, features = ["ring", "kv", "nkeys", "nuid"] }
redis = { version = "1.8", features = ["tls-rustls"] }
opendal = { version = "0.59", default-features = false, features = ["services-s3", "executors-tokio", "layers-retry"] }
# the reqwest transport of opendal without its aws-lc-rs provider: rustls uses ring, as the other dependencies do
opendal-http-transport-reqwest = { version = "0.59", default-features = false, features = ["rustls-no-provider"] }
futures-util = "0.3"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "macros", "net", "time"] }
mime_guess = "2"
dirs = "7"
notify-rust = "4"
dotenvy = "0.15.7"
tempfile = "3.27"
whoami = "2.1"
shlex = "2.0"
shell-escape = "0.1.5"
pad = "0.1.6"
rusqlite = { version = "0.41", features = ["bundled", "column_decltype"] }
mysql = { version = "28.0", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
postgres = { version = "0.19", features = [
    "with-chrono-0_4",
    "with-time-0_3",
    "with-uuid-1",
    "with-serde_json-1",
] }
csv = "1.4"
# LZ4 codecs, to keep the binary small.
parquet = { version = "60", default-features = false, features = ["snap", "zstd", "lz4"] }
bytes = "1"
pulldown-cmark = { version = "0.13", default-features = false }
semver = "1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
fake = "5.1"
identitycard = "0.1"
passwords = "3.1.18"
prometheus-parse = "0.2"
figlet-rs = "1.0"
ini = "2.0"
java-properties = "2"
time = "0.3.55"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "ring", "rustls-native-certs"] }
thiserror = "2.0.21"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
# explicit ring provider for MQTT over TLS: rustls has both ring and aws-lc-rs enabled by other dependencies
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-postgres-rustls = "0.14.0"
strsim = "0.11"

[target.'cfg(target_family = "unix")'.dependencies]
tikv-jemallocator = { version = "0.7" }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }

#[target.'cfg(target_os = "linux")'.dependencies]
#openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
assert_cmd = "2.2"
testresult = "0.4"
rstest = "0.28"

[build-dependencies]
lalrpop = "0.23.2"

[features]
default = []
# Certain features leverage the AVX2 instruction set, but AVX2 can often make
# the entire application slightly slower, even on chips that support it. For
# those cases, consider disabling allow_avx2.
allow_avx2 = []
unstable = []

[profile.dev.package."*"]
# Set the default for dependencies in Development mode.
opt-level = 1
debug-assertions = true

[profile.dev]
# Turn on a small amount of optimisation in Development mode.
opt-level = 1
debug-assertions = true

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1

[profile.release.package]
parquet = { opt-level = "s" }
async-nats = { opt-level = "s" }
rumqttc = { opt-level = "s" }
redis = { opt-level = "s" }
mysql = { opt-level = "s" }
mysql_common = { opt-level = "s" }
tokio-postgres = { opt-level = "s" }
postgres-protocol = { opt-level = "s" }
opendal-core = { opt-level = "s" }
opendal-service-s3 = { opt-level = "s" }
reqsign-core = { opt-level = "s" }
reqsign-aws-core = { opt-level = "s" }
reqsign-aws-v4 = { opt-level = "s" }
quick-xml = { opt-level = "s" }
lettre = { opt-level = "s" }
jsonwebtoken = { opt-level = "s" }
rsa = { opt-level = "s" }
fend-core = { opt-level = "s" }
evalexpr = { opt-level = "s" }
fake = { opt-level = "s" }
sxd-document = { opt-level = "s" }
sxd-xpath = { opt-level = "s" }
tl = { opt-level = "s" }
pulldown-cmark = { opt-level = "s" }
notify-rust = { opt-level = "s" }
figlet-rs = { opt-level = "s" }
clap_builder = { opt-level = "s" }
# cc 会读取 cargo 的 OPT_LEVEL，所以 bundled SQLite 的 C 代码也会用 -Os 编译
libsqlite3-sys = { opt-level = "s" }

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = true
