services:
  local-s3:
    image: linuxchina/local-s3:native-2.5.0-SNAPSHOT
    ports:
      - "19090:29090"
    environment:
      AWS_BUCKETS: "bucket1,mj-artifacts"
  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "1883:1883"
  nats:
    image: nats:2.15.0-alpine
    ports:
      - "14222:4222"
      - "18222:8222"
    command:
      - "-js"
      - "-m"
      - "8222"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz?js-enabled-only=true" ]
  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        # create KV Bucket
        nats kv info bucket1 >/dev/null 2>&1 || \
        nats kv add bucket1 \
          --history 5 \
          --ttl 24h \
          --storage file \
          --replicas 1
        echo "NATS init done"
        nats kv ls
    restart: "no"
  kafka:
    image: apache/kafka-native:4.4.0
    ports:
      - "9092:9092"
  postgresql:
    image: postgres:18.4-alpine3.22
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
  mailtrap-local:
    image: mailtrap/mailtrap-local:latest
    ports:
      - "3535:3535"
      - "3550:3550"
  httpbin:
    image: mccutchen/go-httpbin:latest
    ports:
      - "18080:8080"